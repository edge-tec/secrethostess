<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecretHostess Auto Poster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">SH</div>
        <div>
          <h1>Auto Poster Pro</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <div id="status-pill" class="status-pill idle">IDLE</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total</span>
        <span class="stat-val" id="stat-total">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-val text-yellow" id="stat-pending">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Done</span>
        <span class="stat-val text-green" id="stat-done">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Failed</span>
        <span class="stat-val text-red" id="stat-failed">0</span>
      </div>
    </div>

    <div class="current-info-card" style="border-left: 3px solid #e11d48;">
      <div class="info-row">
        <span class="label">🔑 License Status:</span>
        <span class="val" id="pop-lic-status" style="color:#22c55e;">Checking...</span>
      </div>
      <div class="info-row">
        <span class="label">💳 Post Credits:</span>
        <span class="val" id="pop-lic-credits" style="color:#38bdf8;font-weight:bold;">-</span>
      </div>
      <div class="info-row">
        <span class="label">⏳ Validity Left:</span>
        <span class="val" id="pop-lic-days" style="color:#eab308;">-</span>
      </div>
    </div>

    <div class="current-info-card">
      <div class="info-row">
        <span class="label">Current Account:</span>
        <span class="val" id="curr-account">None</span>
      </div>
      <div class="info-row">
        <span class="label">Next USA City:</span>
        <span class="val text-cyan" id="curr-city">Rotating (Index 1)</span>
      </div>
    </div>

    <div class="action-buttons">
      <button id="btn-start" class="btn btn-primary">Start Posting</button>
      <button id="btn-pause" class="btn btn-warning" style="display: none;">Pause</button>
      <button id="btn-stop" class="btn btn-danger" style="display: none;">Stop</button>
    </div>

    <div class="footer-links">
      <button id="btn-open-dashboard" class="btn btn-outline">
        ⚙️ Open Full Dashboard & Settings
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
